<div class="bootstrap-styles">
  <div class="modal fade" data-bs-backdrop="static">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title" data-bind="text:title"></h3>
          <button
            type="button"
            class="btn-close"
            data-bind="click:cancel"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <p data-bind="visible:message, text:message"></p>
          <!-- ko if: ispasswordrequired.ssh_passwordrequired -->
          <div class="remote-login"></div>
          <div
            class="alert alert-danger slycat-big-scrolling-alert"
            role="alert"
            data-bind="visible:remote.status_type() == 'danger', text: 'Remote authentication failed.'"
          ></div>
          <!-- /ko -->
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" data-bind="click:login,enable:remote.enable">
            <i
              class="fa fa-spinner fa-pulse"
              data-bind="style: {display: remote.enable() ? 'none' : 'inline-block'}"
            ></i>
            <span data-bind="text: remoteAuthLabelSignIn"></span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
